<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview logo House X v5 — metallic domain</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
        background: #1a1214;
        color: #fff;
      }
      h1 {
        font-size: 0.95rem;
        font-weight: 600;
        margin: 1.25rem 1.25rem 0.5rem;
        opacity: 0.75;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.65rem 1.1rem;
        background: linear-gradient(180deg, #7a0e18 0%, #9b111e 55%, #6e0c14 100%);
        border-bottom: 1px solid rgba(252, 211, 77, 0.2);
      }
      .lockup {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.15rem;
      }
      .lockup img {
        display: block;
        height: 2.85rem;
        width: auto;
        max-width: min(15.5rem, 70vw);
        object-fit: contain;
        object-position: left center;
        filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.28));
      }
      .tagline {
        font-size: 0.625rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: rgba(255, 255, 255, 0.92);
        padding-left: 0.1rem;
      }
      .nav-fake {
        margin-left: auto;
        opacity: 0.45;
        font-size: 0.8rem;
      }
      .panel {
        margin: 1.25rem;
        padding: 1.25rem;
        border-radius: 0.75rem;
        background: #0d0d0d;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .panel.checker {
        background:
          linear-gradient(45deg, #222 25%, transparent 25%),
          linear-gradient(-45deg, #222 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #222 75%),
          linear-gradient(-45deg, transparent 75%, #222 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        background-color: #333;
      }
      .panel h2 {
        margin: 0 0 0.75rem;
        font-size: 0.85rem;
        font-weight: 600;
        opacity: 0.85;
        text-shadow: 0 1px 2px #000;
      }
      .panel img {
        max-width: 100%;
        height: auto;
        display: block;
      }
      .note {
        margin: 0 1.25rem 2rem;
        font-size: 0.85rem;
        line-height: 1.45;
        opacity: 0.7;
        max-width: 42rem;
      }
    </style>
  </head>
  <body>
    <h1>1) Header cỡ thật — domain gold metallic (cùng O/X)</h1>
    <header class="bar">
      <div class="lockup">
        <img
          src="./housex-lockup-mark-v5.png"
          width="1024"
          height="350"
          alt="HOUSE X"
        />
        <span class="tagline">Nền tảng số tìm nhà Việt Nam</span>
      </div>
      <span class="nav-fake">Mua bán · Cho thuê · …</span>
    </header>

    <div class="panel checker">
      <h2>2) PNG transparent — 2 màu: trắng phẳng + gold metallic</h2>
      <img
        src="./housex-lockup-mark-v5.png"
        width="1024"
        height="350"
        alt="HOUSE X lockup v5"
      />
    </div>

    <p class="note">
      Domain: gold đặc #e8c547 (đều, không gradient) — dễ đọc. ?v=5d
    </p>
  </body>
</html>
